<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Game Of Roles — Suivi de visionnage</title>

<!-- PWA / installation sur téléphone -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0b0f">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Game Of Roles">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
  <div class="brand">
    <img class="brand-logo" src="icons/logo-256.png" alt="">
    <div>
      <h1>Game Of Roles</h1>
      <span class="subtitle">Suivi de visionnage</span>
    </div>
  </div>
  <div class="header-progress">
    <span id="header-stats" class="header-stats"></span>
    <div class="header-progress-bar"><div id="header-progress-fill" class="header-progress-fill"></div></div>
  </div>
</header>

<div id="update-banner" class="update-banner" hidden>
  <span id="update-banner-text"></span>
  <button id="update-banner-btn" class="btn btn-primary">Mettre à jour</button>
</div>

<main class="app-main">
  <section class="player-column">
    <div id="resume-banner" class="hero-card" hidden>
      <img id="resume-thumb" class="hero-thumb" alt="">
      <div class="hero-overlay">
        <span class="hero-eyebrow">Reprendre la lecture</span>
        <h2 id="resume-title"></h2>
        <div class="hero-meta">
          <span id="resume-arc"></span>
          <span class="dot-sep">·</span>
          <span id="resume-time"></span>
        </div>
        <button id="resume-btn" class="btn btn-primary btn-lg">▶ Reprendre</button>
      </div>
    </div>

    <div class="player-dock">
      <div id="player-wrap" class="player-wrap">
        <div id="player"></div>
      </div>

      <div id="now-playing" class="now-playing" hidden>
        <span id="now-playing-code" class="badge"></span>
        <div class="now-playing-text">
          <strong id="now-playing-title"></strong>
          <span id="now-playing-arc" class="muted"></span>
        </div>
      </div>
    </div>
  </section>

  <aside class="list-column">
    <div class="filters" id="filters">
      <button class="filter-btn active" data-filter="all">Tous</button>
      <button class="filter-btn" data-filter="todo">À voir</button>
      <button class="filter-btn" data-filter="in-progress">En cours</button>
      <button class="filter-btn" data-filter="done">Terminé</button>
    </div>
    <div id="episode-list" class="episode-list"></div>
  </aside>
</main>

<footer class="app-footer">
  <span id="footer-note">Outil personnel — progression stockée uniquement dans ce navigateur.</span>
  <div class="footer-actions">
    <span id="update-status" class="update-status"></span>
    <button id="update-btn" class="link-btn" hidden>Vérifier les mises à jour</button>
    <button id="reset-progress-btn" class="link-btn">Réinitialiser la progression</button>
  </div>
</footer>

<script src="episodes.js"></script>
<script src="app.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
